<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>智慧路邊停車媒合 APP</title>

<link
  href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css"
  rel="stylesheet"
>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>

<style>
* {
  box-sizing: border-box;
}

html,
body {
  width: 100%;
  height: 100%;
  margin: 0;
  overflow: hidden;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    "Noto Sans TC",
    sans-serif;
  background: #f5f5f5;
}

button,
input {
  font: inherit;
}

#app,
#map {
  width: 100%;
  height: 100%;
}

#app {
  position: relative;
  overflow: hidden;
}

/* ================================
   漢堡按鈕
================================ */

.menu-button {
  position: absolute;
  top: 18px;
  right: 18px;
  z-index: 30;

  width: 48px;
  height: 48px;

  display: flex;
  align-items: center;
  justify-content: center;

  border: 0;
  border-radius: 14px;

  background: rgba(255, 255, 255, 0.97);

  box-shadow:
    0 4px 18px rgba(0, 0, 0, 0.14);

  cursor: pointer;
}

.menu-lines {
  width: 21px;

  display: flex;
  flex-direction: column;

  gap: 5px;
}

.menu-lines span {
  width: 100%;
  height: 2px;

  border-radius: 999px;

  background: #202124;
}

/* ================================
   Menu backdrop
================================ */

.menu-backdrop {
  position: absolute;
  inset: 0;

  z-index: 39;

  background: rgba(0, 0, 0, 0.18);

  opacity: 0;

  pointer-events: none;

  transition: opacity 0.2s ease;
}

.menu-backdrop.open {
  opacity: 1;
  pointer-events: auto;
}

/* ================================
   側邊 Menu
================================ */

.side-menu {
  position: absolute;

  top: 0;
  right: 0;
  bottom: 0;

  z-index: 40;

  width: min(340px, 86vw);

  padding: 22px;

  overflow-y: auto;

  background: #fff;

  box-shadow:
    -8px 0 32px rgba(0, 0, 0, 0.15);

  transform: translateX(105%);

  transition: transform 0.25s ease;
}

.side-menu.open {
  transform: translateX(0);
}

.menu-header {
  display: flex;
  align-items: center;
  justify-content: space-between;

  margin-bottom: 26px;
}

.menu-title {
  color: #1f2937;

  font-size: 20px;
  font-weight: 800;
}

.menu-version {
  margin-top: 3px;

  color: #9ca3af;

  font-size: 12px;
}

.menu-close {
  width: 38px;
  height: 38px;

  border: 0;
  border-radius: 10px;

  background: #f3f4f6;

  color: #444;

  font-size: 22px;

  cursor: pointer;
}

.menu-section-title {
  margin-bottom: 10px;

  color: #6b7280;

  font-size: 12px;
  font-weight: 700;

  letter-spacing: 0.06em;
}

.filter-list {
  display: flex;
  flex-direction: column;

  gap: 8px;
}

.filter-item {
  min-height: 54px;

  padding: 10px 12px;

  display: flex;
  align-items: center;

  gap: 11px;

  border: 1px solid #eceff3;
  border-radius: 13px;

  cursor: pointer;
}

.filter-item:hover {
  background: #f8f9fa;
}

.filter-item input {
  width: 18px;
  height: 18px;

  cursor: pointer;
}

.filter-dot {
  width: 14px;
  height: 14px;

  flex: 0 0 14px;

  border: 2px solid #fff;
  border-radius: 50%;

  box-shadow:
    0 0 0 1px rgba(0, 0, 0, 0.1);
}

.filter-dot.green {
  background: #22c55e;
}

.filter-dot.red {
  background: #ef4444;
}

.filter-dot.gray {
  background: #9ca3af;
}

.filter-name {
  flex: 1;

  color: #333;

  font-size: 14px;
  font-weight: 650;
}

.filter-count {
  min-width: 24px;

  padding: 3px 7px;

  border-radius: 999px;

  background: #f1f3f5;

  color: #777;

  font-size: 11px;

  text-align: center;
}

.menu-actions {
  margin-top: 16px;

  display: grid;

  grid-template-columns:
    1fr
    1fr;

  gap: 9px;
}

.menu-action {
  height: 42px;

  border: 0;
  border-radius: 11px;

  background: #f3f4f6;

  color: #333;

  font-weight: 650;

  cursor: pointer;
}

/* ================================
   Bottom card
================================ */

.bottom-card {
  position: absolute;

  left: 50%;
  bottom: 18px;

  z-index: 25;

  width: min(calc(100% - 36px), 720px);

  padding: 12px;

  border-radius: 18px;

  background: rgba(255, 255, 255, 0.97);

  box-shadow:
    0 8px 32px rgba(0, 0, 0, 0.16);

  backdrop-filter: blur(8px);

  transform: translateX(-50%);
}

.bottom-main {
  display: flex;
  align-items: center;

  gap: 12px;
}

.bottom-info {
  min-width: 0;

  flex: 1;
}

.bottom-count {
  overflow: hidden;

  color: #222;

  font-size: 15px;
  font-weight: 750;

  text-overflow: ellipsis;
  white-space: nowrap;
}

.bottom-status {
  margin-top: 3px;

  overflow: hidden;

  color: #8a8f98;

  font-size: 11px;

  text-overflow: ellipsis;
  white-space: nowrap;
}

.refresh-button {
  min-width: 92px;
  height: 44px;

  padding: 0 15px;

  flex: 0 0 auto;

  border: 0;
  border-radius: 12px;

  background: #1677ff;

  color: #fff;

  font-size: 14px;
  font-weight: 700;

  cursor: pointer;
}

/* ================================
   GPS
================================ */

.user-dot {
  width: 18px;
  height: 18px;

  border: 3px solid #fff;
  border-radius: 50%;

  background: #1677ff;

  box-shadow:
    0 0 0 4px rgba(22, 119, 255, 0.25);
}

/* ================================
   Popup
================================ */

.parking-popup {
  min-width: 210px;

  font-size: 13px;
  line-height: 1.65;
}

.parking-title {
  margin-bottom: 7px;

  font-size: 17px;
  font-weight: 800;
}

.parking-status-line {
  margin-bottom: 7px;

  display: flex;
  align-items: center;

  gap: 6px;
}

.popup-status-dot {
  width: 10px;
  height: 10px;

  border-radius: 50%;
}

.row {
  margin: 3px 0;
}

.maplibregl-popup-content {
  padding: 13px 15px;

  border-radius: 14px;
}

/* ================================
   隱藏 MapLibre +/- 控制
================================ */

.maplibregl-ctrl-top-left,
.maplibregl-ctrl-top-right {
  display: none !important;
}

.maplibregl-ctrl-bottom-right {
  margin-bottom: 92px;
}

/* ================================
   Mobile
================================ */

@media (max-width: 600px) {
  .menu-button {
    top: 12px;
    right: 12px;

    width: 44px;
    height: 44px;

    border-radius: 13px;
  }

  .side-menu {
    width: min(320px, 88vw);

    padding: 19px;
  }

  .bottom-card {
    bottom: max(
      10px,
      env(safe-area-inset-bottom)
    );

    width: calc(100% - 20px);

    padding: 10px;

    border-radius: 16px;
  }

  .bottom-main {
    gap: 8px;
  }

  .bottom-count {
    font-size: 13px;
  }

  .bottom-status {
    font-size: 10px;
  }

  .refresh-button {
    min-width: 76px;
    height: 42px;

    padding: 0 11px;

    font-size: 13px;
  }

  .maplibregl-ctrl-bottom-right {
    margin-bottom: 88px;
  }
}

@media (max-width: 390px) {
  .bottom-count {
    font-size: 12px;
  }

  .refresh-button {
    min-width: 68px;

    padding: 0 9px;
  }
}
</style>
</head>

<body>

<div id="app">

  <div id="map"></div>

  <button
    id="menuButton"
    class="menu-button"
    type="button"
    aria-label="開啟停車格篩選"
  >
    <div class="menu-lines">
      <span></span>
      <span></span>
      <span></span>
    </div>
  </button>

  <div
    id="menuBackdrop"
    class="menu-backdrop"
  ></div>

  <aside
    id="sideMenu"
    class="side-menu"
  >

    <div class="menu-header">

      <div>
        <div class="menu-title">
          停車格篩選
        </div>

        <div class="menu-version">
          智慧停車 APP v1.0.3
        </div>
      </div>

      <button
        id="menuClose"
        class="menu-close"
        type="button"
      >
        ×
      </button>

    </div>

    <div class="menu-section-title">
      顯示停車格狀態
    </div>

    <div class="filter-list">

      <label class="filter-item">

        <input
          id="filterEmpty"
          type="checkbox"
          checked
        >

        <span
          class="filter-dot green"
        ></span>

        <span class="filter-name">
          空白停車格
        </span>

        <span
          id="emptyCount"
          class="filter-count"
        >
          0
        </span>

      </label>

      <label class="filter-item">

        <input
          id="filterOccupied"
          type="checkbox"
          checked
        >

        <span
          class="filter-dot red"
        ></span>

        <span class="filter-name">
          已有停車
        </span>

        <span
          id="occupiedCount"
          class="filter-count"
        >
          0
        </span>

      </label>

      <label class="filter-item">

        <input
          id="filterUnknown"
          type="checkbox"
          checked
        >

        <span
          class="filter-dot gray"
        ></span>

        <span class="filter-name">
          狀態未知
        </span>

        <span
          id="unknownCount"
          class="filter-count"
        >
          0
        </span>

      </label>

    </div>

    <div class="menu-actions">

      <button
        id="selectAllButton"
        class="menu-action"
        type="button"
      >
        全部顯示
      </button>

      <button
        id="clearAllButton"
        class="menu-action"
        type="button"
      >
        全部隱藏
      </button>

    </div>

  </aside>

  <div class="bottom-card">

    <div class="bottom-main">

      <div class="bottom-info">

        <div
          id="bottomCount"
          class="bottom-count"
        >
          正在準備停車格資料…
        </div>

        <div
          id="bottomStatus"
          class="bottom-status"
        >
          APP v1.0.3
        </div>

      </div>

      <button
        id="reloadButton"
        class="refresh-button"
        type="button"
      >
        重新整理
      </button>

    </div>

  </div>

</div>

<script>
const APP_VERSION = "1.0.3";

const DEFAULT_CENTER = [
  121.4618,
  25.0114
];

const MIN_ZOOM = 15;
const MAX_VISIBLE_MARKERS = 1500;

const MAP_STYLE_URL =
  "https://tiles.openfreemap.org/styles/liberty";

/* ================================
   DOM
================================ */

const menuButton =
  document.getElementById("menuButton");

const menuClose =
  document.getElementById("menuClose");

const menuBackdrop =
  document.getElementById("menuBackdrop");

const sideMenu =
  document.getElementById("sideMenu");

const reloadButton =
  document.getElementById("reloadButton");

const bottomCount =
  document.getElementById("bottomCount");

const bottomStatus =
  document.getElementById("bottomStatus");

const filterEmpty =
  document.getElementById("filterEmpty");

const filterOccupied =
  document.getElementById("filterOccupied");

const filterUnknown =
  document.getElementById("filterUnknown");

const emptyCount =
  document.getElementById("emptyCount");

const occupiedCount =
  document.getElementById("occupiedCount");

const unknownCount =
  document.getElementById("unknownCount");

const selectAllButton =
  document.getElementById("selectAllButton");

const clearAllButton =
  document.getElementById("clearAllButton");

/* ================================
   State
================================ */

let parkingData = [];
let userMarker = null;
let mapReady = false;
let styleSimplified = false;
let dataUpdatedAt = "";

/* ================================
   Map
================================ */

const map =
  new maplibregl.Map({
    container: "map",
    style: MAP_STYLE_URL,
    center: DEFAULT_CENTER,
    zoom: 16,

    pitch: 0,
    bearing: 0,

    minZoom: 11,
    maxZoom: 19,

    attributionControl: false,

    dragRotate: false,
    pitchWithRotate: false,
    touchPitch: false
  });

map.addControl(
  new maplibregl.AttributionControl({
    compact: true
  }),
  "bottom-right"
);

/* ================================
   Menu
================================ */

function openMenu() {
  sideMenu.classList.add("open");
  menuBackdrop.classList.add("open");
}

function closeMenu() {
  sideMenu.classList.remove("open");
  menuBackdrop.classList.remove("open");
}

menuButton.addEventListener(
  "click",
  openMenu
);

menuClose.addEventListener(
  "click",
  closeMenu
);

menuBackdrop.addEventListener(
  "click",
  closeMenu
);

document.addEventListener(
  "keydown",
  event => {
    if (event.key === "Escape") {
      closeMenu();
    }
  }
);

/* ================================
   HTML escape
================================ */

function escapeHTML(value) {
  return String(value ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

/* ================================
   乾淨平面地圖
   保留：
   - 路面
   - 路名
   - 店家 / POI
   - 水域 / 綠地 / 建築
   隱藏 3D 與過多資訊
================================ */

function simplifyMapStyle() {
  if (styleSimplified) {
    return;
  }

  const style =
    map.getStyle();

  if (
    !style ||
    !style.layers
  ) {
    return;
  }

  for (
    const layer
    of style.layers
  ) {

    const id =
      String(
        layer.id || ""
      )
      .toLowerCase();

    const sourceLayer =
      String(
        layer["source-layer"] || ""
      )
      .toLowerCase();

    const type =
      String(
        layer.type || ""
      )
      .toLowerCase();

    const keyword =
      `${id} ${sourceLayer}`;

    if (
      type ===
      "fill-extrusion"
    ) {
      map.setLayoutProperty(
        layer.id,
        "visibility",
        "none"
      );

      continue;
    }

    const isBackground =
      type ===
      "background";

    const isWater =
      /water|ocean|river|lake|stream|canal/
      .test(keyword);

    const isLand =
      /landuse|landcover|park|grass|wood|forest|residential/
      .test(keyword)
      &&
      type !== "symbol";

    const isBuilding =
      /building/
      .test(keyword)
      &&
      type === "fill";

    const isRoadGeometry =
      /road|street|highway|transport|bridge|tunnel|motorway|trunk|primary|secondary|tertiary|path/
      .test(keyword)
      &&
      (
        type === "line" ||
        type === "fill"
      );

    const isRoadLabel =
      /road|street|highway|transport|bridge|tunnel|motorway|trunk|primary|secondary|tertiary/
      .test(keyword)
      &&
      type === "symbol";

    const isShopLabel =
      /poi|shop|store|amenity|commercial|retail|restaurant|cafe|food|bank|hospital|pharmacy|hotel/
      .test(keyword)
      &&
      type === "symbol";

    const keep =
      isBackground ||
      isWater ||
      isLand ||
      isBuilding ||
      isRoadGeometry ||
      isRoadLabel ||
      isShopLabel;

    map.setLayoutProperty(
      layer.id,
      "visibility",
      keep
        ? "visible"
        : "none"
    );
  }

  styleSimplified = true;
}

/* ================================
   載入 GitHub Pages 靜態 JSON
================================ */

async function loadParking() {
  reloadButton.disabled = true;
  reloadButton.textContent = "更新中…";

  bottomCount.textContent =
    "正在讀取停車格資料…";

  bottomStatus.textContent =
    `APP v${APP_VERSION}`;

  try {
    const response =
      await fetch(
        `./parking.json?t=${Date.now()}`,
        {
          cache: "no-store"
        }
      );

    if (!response.ok) {
      throw new Error(
        `parking.json HTTP ${response.status}`
      );
    }

    const result =
      await response.json();

    parkingData =
      Array.isArray(result.data)
        ? result.data
        : [];

    dataUpdatedAt =
      result.updatedAt || "";

    if (!parkingData.length) {
      throw new Error(
        "parking.json 沒有停車格資料"
      );
    }

    updateDataStatus();
    renderParking();

  } catch (error) {
    console.error(error);

    bottomCount.textContent =
      "目前無法取得停車格資料";

    bottomStatus.textContent =
      "錯誤：" +
      error.message;

  } finally {
    reloadButton.disabled = false;
    reloadButton.textContent = "重新整理";
  }
}

function updateDataStatus() {
  let updateText =
    `已載入 ${parkingData.length.toLocaleString()} 個停車格`;

  if (dataUpdatedAt) {
    const date =
      new Date(dataUpdatedAt);

    if (!Number.isNaN(date.getTime())) {
      updateText +=
        ` · ${date.toLocaleString("zh-TW")}`;
    }
  }

  bottomStatus.textContent =
    updateText;
}

/* ================================
   Parking layer
================================ */

function ensureParkingSourceAndLayer() {
  if (
    !map.getSource(
      "parking-source"
    )
  ) {
    map.addSource(
      "parking-source",
      {
        type: "geojson",

        data: {
          type: "FeatureCollection",
          features: []
        }
      }
    );
  }

  if (
    !map.getLayer(
      "parking-layer"
    )
  ) {
    map.addLayer({
      id: "parking-layer",

      type: "circle",

      source: "parking-source",

      paint: {
        "circle-radius": [
          "interpolate",
          ["linear"],
          ["zoom"],

          14, 4,
          16, 6,
          18, 8
        ],

        "circle-color": [
          "get",
          "markerColor"
        ],

        "circle-stroke-color":
          "#ffffff",

        "circle-stroke-width":
          2,

        "circle-opacity":
          0.96
      }
    });
  }
}

function buildFeatureCollection(list) {
  return {
    type: "FeatureCollection",

    features:
      list.map(
        parking => ({
          type: "Feature",

          geometry: {
            type: "Point",

            coordinates: [
              parking.lng,
              parking.lat
            ]
          },

          properties: {
            id:
              parking.id || "",

            cellId:
              parking.cellId || "",

            name:
              parking.name || "",

            roadName:
              parking.roadName || "",

            hour:
              parking.hour || "",

            pay:
              parking.pay || "",

            payCash:
              parking.payCash || "",

            cellStatus:
              parking.cellStatus || "",

            parkingStatus:
              parking.parkingStatus || "",

            displayStatus:
              parking.statusLabel ||
              "狀態未知",

            statusKey:
              parking.statusKey ||
              "unknown",

            markerColor:
              parking.markerColor ||
              "#9ca3af"
          }
        })
      )
  };
}

/* ================================
   Filter
================================ */

function getActiveFilters() {
  const filters =
    new Set();

  if (filterEmpty.checked) {
    filters.add("empty");
  }

  if (filterOccupied.checked) {
    filters.add("occupied");
  }

  if (filterUnknown.checked) {
    filters.add("unknown");
  }

  return filters;
}

function updateFilterCounts(
  visible
) {
  const counts = {
    empty: 0,
    occupied: 0,
    unknown: 0
  };

  visible.forEach(
    parking => {
      const key =
        parking.statusKey ||
        "unknown";

      if (
        counts[key] !==
        undefined
      ) {
        counts[key] += 1;
      }
    }
  );

  emptyCount.textContent =
    counts.empty;

  occupiedCount.textContent =
    counts.occupied;

  unknownCount.textContent =
    counts.unknown;
}

/* ================================
   Render
================================ */

function renderParking() {
  if (
    !mapReady ||
    !map.getSource(
      "parking-source"
    )
  ) {
    return;
  }

  if (
    !parkingData.length
  ) {
    map
      .getSource(
        "parking-source"
      )
      .setData({
        type:
          "FeatureCollection",
        features:
          []
      });

    bottomCount.textContent =
      "目前沒有停車格資料";

    return;
  }

  const zoom =
    map.getZoom();

  if (
    zoom <
    MIN_ZOOM
  ) {
    map
      .getSource(
        "parking-source"
      )
      .setData({
        type:
          "FeatureCollection",
        features:
          []
      });

    bottomCount.textContent =
      "請放大地圖查看停車格";

    return;
  }

  const bounds =
    map.getBounds();

  const visibleAll =
    parkingData.filter(
      parking =>
        bounds.contains([
          parking.lng,
          parking.lat
        ])
    );

  updateFilterCounts(
    visibleAll
  );

  const activeFilters =
    getActiveFilters();

  const filtered =
    visibleAll.filter(
      parking =>
        activeFilters.has(
          parking.statusKey ||
          "unknown"
        )
    );

  const list =
    filtered.slice(
      0,
      MAX_VISIBLE_MARKERS
    );

  map
    .getSource(
      "parking-source"
    )
    .setData(
      buildFeatureCollection(
        list
      )
    );

  if (
    visibleAll.length === 0
  ) {
    bottomCount.textContent =
      "目前畫面內沒有停車格";

  } else if (
    filtered.length ===
    visibleAll.length
  ) {
    bottomCount.textContent =
      `目前畫面內有 ${visibleAll.length.toLocaleString()} 個停車格`;

  } else {
    bottomCount.textContent =
      `目前顯示 ${filtered.length.toLocaleString()} / ${visibleAll.length.toLocaleString()} 個停車格`;
  }
}

/* ================================
   Popup
================================ */

function showParkingPopup(
  feature
) {
  const p =
    feature.properties || {};

  const statusColor =
    p.markerColor ||
    "#9ca3af";

  const popupHTML = `
    <div class="parking-popup">

      <div class="parking-title">
        路邊停車格
      </div>

      <div class="parking-status-line">

        <span
          class="popup-status-dot"
          style="background:${escapeHTML(statusColor)}"
        ></span>

        <strong>
          ${escapeHTML(
            p.displayStatus ||
            "狀態未知"
          )}
        </strong>

      </div>

      <div class="row">
        車格編號：
        <strong>
          ${escapeHTML(
            p.cellId ||
            p.id ||
            "未提供"
          )}
        </strong>
      </div>

      <div class="row">
        路段：
        ${escapeHTML(
          p.roadName ||
          "未提供"
        )}
      </div>

      <div class="row">
        類型：
        ${escapeHTML(
          p.name ||
          "未提供"
        )}
      </div>

      <div class="row">
        收費方式：
        ${escapeHTML(
          p.pay ||
          "未提供"
        )}
      </div>

      <div class="row">
        收費：
        ${escapeHTML(
          p.payCash ||
          "未提供"
        )}
      </div>

      <div class="row">
        收費時間：
        ${escapeHTML(
          p.hour ||
          "未提供"
        )}
      </div>

    </div>
  `;

  new maplibregl.Popup({
    closeButton: true,
    closeOnClick: true,
    offset: 12
  })
    .setLngLat(
      feature
        .geometry
        .coordinates
    )
    .setHTML(
      popupHTML
    )
    .addTo(map);
}

/* ================================
   GPS
================================ */

function setUserLocation(
  lng,
  lat
) {
  if (userMarker) {
    userMarker.remove();
  }

  const element =
    document.createElement(
      "div"
    );

  element.className =
    "user-dot";

  userMarker =
    new maplibregl.Marker({
      element,
      anchor: "center"
    })
      .setLngLat([
        lng,
        lat
      ])
      .setPopup(
        new maplibregl.Popup({
          offset: 16
        })
          .setText(
            "你的目前位置"
          )
      )
      .addTo(map);
}

function locateUser() {
  if (
    !navigator.geolocation
  ) {
    map.jumpTo({
      center:
        DEFAULT_CENTER,
      zoom:
        16,
      pitch:
        0,
      bearing:
        0
    });

    return;
  }

  navigator
    .geolocation
    .getCurrentPosition(

      position => {
        const lat =
          position.coords.latitude;

        const lng =
          position.coords.longitude;

        setUserLocation(
          lng,
          lat
        );

        map.jumpTo({
          center: [
            lng,
            lat
          ],

          zoom: 16,

          pitch: 0,
          bearing: 0
        });

        renderParking();
      },

      () => {
        map.jumpTo({
          center:
            DEFAULT_CENTER,

          zoom:
            16,

          pitch:
            0,

          bearing:
            0
        });

        renderParking();
      },

      {
        enableHighAccuracy:
          true,

        timeout:
          10000,

        maximumAge:
          0
      }
    );
}

/* ================================
   Filter events
================================ */

[
  filterEmpty,
  filterOccupied,
  filterUnknown
]
.forEach(
  checkbox => {
    checkbox
      .addEventListener(
        "change",
        renderParking
      );
  }
);

selectAllButton
  .addEventListener(
    "click",
    () => {
      filterEmpty.checked =
        true;

      filterOccupied.checked =
        true;

      filterUnknown.checked =
        true;

      renderParking();
    }
  );

clearAllButton
  .addEventListener(
    "click",
    () => {
      filterEmpty.checked =
        false;

      filterOccupied.checked =
        false;

      filterUnknown.checked =
        false;

      renderParking();
    }
  );

reloadButton
  .addEventListener(
    "click",
    loadParking
  );

/* ================================
   Map events
================================ */

map.on(
  "load",
  () => {
    simplifyMapStyle();

    ensureParkingSourceAndLayer();

    mapReady =
      true;

    map.on(
      "click",
      "parking-layer",
      event => {
        const feature =
          event.features &&
          event.features[0];

        if (feature) {
          showParkingPopup(
            feature
          );
        }
      }
    );

    map.on(
      "mouseenter",
      "parking-layer",
      () => {
        map
          .getCanvas()
          .style
          .cursor =
          "pointer";
      }
    );

    map.on(
      "mouseleave",
      "parking-layer",
      () => {
        map
          .getCanvas()
          .style
          .cursor =
          "";
      }
    );

    locateUser();

    loadParking();
  }
);

map.on(
  "moveend",
  renderParking
);

map.on(
  "zoomend",
  renderParking
);

map.on(
  "error",
  event => {
    console.warn(
      "地圖錯誤：",
      event
    );
  }
);
</script>

</body>
</html>
