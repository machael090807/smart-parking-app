<script>


/* =====================================================
   VERSION
===================================================== */

const APP_VERSION =
  "1.0.4";



/* =====================================================
   LIVE API
===================================================== */

const LIVE_API_URL =
  "https://smart-parking-app-api.vercel.app/api/parking";



/* =====================================================
   CONFIG
===================================================== */

const DEFAULT_CENTER = [

  121.4618,

  25.0114

];


const MIN_ZOOM =
  15;


const MAX_VISIBLE_MARKERS =
  1500;


const MAP_STYLE_URL =
  "https://tiles.openfreemap.org/styles/liberty";



/* =====================================================
   DOM
===================================================== */

const menuButton =
  document.getElementById(
    "menuButton"
  );


const menuClose =
  document.getElementById(
    "menuClose"
  );


const menuBackdrop =
  document.getElementById(
    "menuBackdrop"
  );


const sideMenu =
  document.getElementById(
    "sideMenu"
  );


const locateButton =
  document.getElementById(
    "locateButton"
  );


const reloadButton =
  document.getElementById(
    "reloadButton"
  );


const bottomCount =
  document.getElementById(
    "bottomCount"
  );


const bottomStatus =
  document.getElementById(
    "bottomStatus"
  );


const filterEmpty =
  document.getElementById(
    "filterEmpty"
  );


const filterOccupied =
  document.getElementById(
    "filterOccupied"
  );


const filterUnknown =
  document.getElementById(
    "filterUnknown"
  );


const emptyCount =
  document.getElementById(
    "emptyCount"
  );


const occupiedCount =
  document.getElementById(
    "occupiedCount"
  );


const unknownCount =
  document.getElementById(
    "unknownCount"
  );


const selectAllButton =
  document.getElementById(
    "selectAllButton"
  );


const clearAllButton =
  document.getElementById(
    "clearAllButton"
  );



/* =====================================================
   STATE
===================================================== */

let parkingData =
  [];


let userMarker =
  null;


let mapReady =
  false;


let styleSimplified =
  false;



/* =====================================================
   MAP
===================================================== */

const map =

  new maplibregl.Map({

    container:
      "map",

    style:
      MAP_STYLE_URL,

    center:
      DEFAULT_CENTER,

    zoom:
      16,

    pitch:
      0,

    bearing:
      0,

    minZoom:
      11,

    maxZoom:
      19,

    /*
      不顯示右下角 attribution。

      attribution 仍保留於漢堡選單內。
    */

    attributionControl:
      false,

    dragRotate:
      false,

    pitchWithRotate:
      false,

    touchPitch:
      false

  });



/* =====================================================
   MENU
===================================================== */

function openMenu() {

  sideMenu
    .classList
    .add(
      "open"
    );


  menuBackdrop
    .classList
    .add(
      "open"
    );

}



function closeMenu() {

  sideMenu
    .classList
    .remove(
      "open"
    );


  menuBackdrop
    .classList
    .remove(
      "open"
    );

}



menuButton.addEventListener(

  "click",

  openMenu

);



menuClose.addEventListener(

  "click",

  closeMenu

);



menuBackdrop.addEventListener(

  "click",

  closeMenu

);



document.addEventListener(

  "keydown",

  event => {


    if (
      event.key ===
      "Escape"
    ) {


      closeMenu();

    }

  }

);



/* =====================================================
   COMMON
===================================================== */

function getValue(

  object,

  ...keys

) {


  for (
    const key
    of
    keys
  ) {


    const value =
      object[
        key
      ];


    if (

      value !==
      undefined

      &&

      value !==
      null

      &&

      value !==
      ""

    ) {


      return value;

    }

  }


  return "";

}



function escapeHTML(
  value
) {


  return String(
    value ?? ""
  )

  .replaceAll(
    "&",
    "&amp;"
  )

  .replaceAll(
    "<",
    "&lt;"
  )

  .replaceAll(
    ">",
    "&gt;"
  )

  .replaceAll(
    '"',
    "&quot;"
  )

  .replaceAll(
    "'",
    "&#039;"
  );

}



/* =====================================================
   CLEAN MAP STYLE
===================================================== */

function simplifyMapStyle() {


  if (
    styleSimplified
  ) {

    return;

  }


  const style =
    map.getStyle();


  if (

    !style

    ||

    !style.layers

  ) {

    return;

  }



  for (
    const layer
    of
    style.layers
  ) {


    const id =

      String(
        layer.id ||
        ""
      )

      .toLowerCase();



    const sourceLayer =

      String(

        layer[
          "source-layer"
        ]

        ||

        ""

      )

      .toLowerCase();



    const type =

      String(

        layer.type

        ||

        ""

      )

      .toLowerCase();



    const keyword =
      `${id} ${sourceLayer}`;



    /*
      3D 建築全部隱藏
    */

    if (
      type ===
      "fill-extrusion"
    ) {


      map.setLayoutProperty(

        layer.id,

        "visibility",

        "none"

      );


      continue;

    }



    const isBackground =
      type ===
      "background";



    const isWater =

      /water|ocean|river|lake|stream|canal/
      .test(
        keyword
      );



    const isLand =

      /landuse|landcover|park|grass|wood|forest|residential/
      .test(
        keyword
      )

      &&

      type !==
      "symbol";



    const isBuilding =

      /building/
      .test(
        keyword
      )

      &&

      type ===
      "fill";



    const isRoadGeometry =

      /road|street|highway|transport|bridge|tunnel|motorway|trunk|primary|secondary|tertiary|path/
      .test(
        keyword
      )

      &&

      (
        type ===
        "line"

        ||

        type ===
        "fill"
      );



    const isRoadLabel =

      /road|street|highway|transport|bridge|tunnel|motorway|trunk|primary|secondary|tertiary/
      .test(
        keyword
      )

      &&

      type ===
      "symbol";



    /*
      保留店家 POI
    */

    const isShopLabel =

      /poi|shop|store|amenity|commercial|retail|restaurant|cafe|food|bank|hospital|pharmacy|hotel/
      .test(
        keyword
      )

      &&

      type ===
      "symbol";



    const keep =

      isBackground

      ||

      isWater

      ||

      isLand

      ||

      isBuilding

      ||

      isRoadGeometry

      ||

      isRoadLabel

      ||

      isShopLabel;



    map.setLayoutProperty(

      layer.id,

      "visibility",

      keep
        ? "visible"
        : "none"

    );

  }


  styleSimplified =
    true;

}



/* =====================================================
   STATUS
===================================================== */

function analyzeSingleStatus(
  value
) {


  if (

    value ===
    undefined

    ||

    value ===
    null

  ) {

    return null;

  }



  const normalized =

    String(
      value
    )

    .trim()

    .toLowerCase();



  if (
    !normalized
  ) {

    return null;

  }



  if (

    [
      "0",
      "n",
      "no",
      "false"
    ]

    .includes(
      normalized
    )

  ) {


    return {

      key:
        "empty",

      label:
        "空白停車格",

      color:
        "#22c55e"

    };

  }



  if (

    [
      "1",
      "y",
      "yes",
      "true"
    ]

    .includes(
      normalized
    )

  ) {


    return {

      key:
        "occupied",

      label:
        "已有停車",

      color:
        "#ef4444"

    };

  }



  const emptyKeywords = [

    "空位",

    "空車位",

    "無車",

    "可停",

    "空車",

    "available",

    "empty",

    "vacant",

    "free"

  ];



  const occupiedKeywords = [

    "有車",

    "已停",

    "占用",

    "佔用",

    "occupied",

    "full",

    "busy"

  ];



  if (

    emptyKeywords.some(

      keyword =>

        normalized.includes(
          keyword
        )

    )

  ) {


    return {

      key:
        "empty",

      label:
        "空白停車格",

      color:
        "#22c55e"

    };

  }



  if (

    occupiedKeywords.some(

      keyword =>

        normalized.includes(
          keyword
        )

    )

  ) {


    return {

      key:
        "occupied",

      label:
        "已有停車",

      color:
        "#ef4444"

    };

  }


  return null;

}



function getAvailability(
  parking
) {


  const candidates = [

    parking.parkingStatus,

    parking.cellStatus

  ];



  for (
    const candidate
    of
    candidates
  ) {


    const result =

      analyzeSingleStatus(
        candidate
      );


    if (
      result
    ) {


      return result;

    }

  }



  return {

    key:
      "unknown",

    label:
      "狀態未知",

    color:
      "#9ca3af"

  };

}



/* =====================================================
   NORMALIZE PARKING DATA
===================================================== */

function normalizeParking(
  raw
) {


  const lat =

    Number(

      getValue(

        raw,

        "latitude",

        "Latitude",

        "LATITUDE",

        "lat",

        "LAT",

        "定位坐標[緯度]",

        "定位坐標 [緯度]",

        "緯度"

      )

    );



  const lng =

    Number(

      getValue(

        raw,

        "longitude",

        "Longitude",

        "LONGITUDE",

        "lng",

        "lon",

        "LNG",

        "LON",

        "定位坐標[經度]",

        "定位坐標 [經度]",

        "經度"

      )

    );



  if (

    !Number.isFinite(
      lat
    )

    ||

    !Number.isFinite(
      lng
    )

    ||

    lat === 0

    ||

    lng === 0

    ||

    lat < 24

    ||

    lat > 26

    ||

    lng < 120

    ||

    lng > 123

  ) {


    return null;

  }



  const parking = {


    id:

      String(

        getValue(

          raw,

          "id",

          "ID",

          "系統編號"

        )

      ),


    cellId:

      String(

        getValue(

          raw,

          "cellid",

          "CELLID",

          "CellID",

          "車格編號"

        )

      ),


    name:

      String(

        getValue(

          raw,

          "name",

          "NAME",

          "類型"

        )

      ),


    roadName:

      String(

        getValue(

          raw,

          "roadname",

          "ROADNAME",

          "RoadName",

          "路段名稱"

        )

      ),


    hour:

      String(

        getValue(

          raw,

          "hour",

          "HOUR",

          "開放停車時間說明"

        )

      ),


    pay:

      String(

        getValue(

          raw,

          "pay",

          "PAY",

          "收費方式"

        )

      ),


    payCash:

      String(

        getValue(

          raw,

          "paycash",

          "PAYCASH",

          "收費計價"

        )

      ),


    cellStatus:

      String(

        getValue(

          raw,

          "cellstatus",

          "CELLSTATUS",

          "CellStatus",

          "車格狀態"

        )

      ),


    parkingStatus:

      String(

        getValue(

          raw,

          "parkingstatus",

          "PARKINGSTATUS",

          "ParkingStatus",

          "停車狀態"

        )

      ),


    lat,

    lng

  };



  const availability =

    getAvailability(
      parking
    );



  parking.markerColor =
    availability.color;


  parking.statusKey =
    availability.key;


  parking.displayStatus =
    availability.label;


  return parking;

}



/* =====================================================
   CSV
===================================================== */

function parseLiveCSV(
  csvText
) {


  const result =

    Papa.parse(

      csvText,

      {

        header:
          true,

        skipEmptyLines:
          true

      }

    );



  return result.data

    .map(
      normalizeParking
    )

    .filter(
      Boolean
    );

}

function createParkingIcon(

) {

    36;

    14;

    );

    );

/* =====================================================
   ROAD ALIGNMENT
===================================================== */

function hashString(
  str
) {


  let hash =
    0;


  const text =
    String(
      str ||
      ""
    );



  for (

    let i =
      0;

    i <
    text.length;

    i++

  ) {


    hash =

      (
        (
          hash << 5
        )

        -

        hash

      )

      +

      text.charCodeAt(
        i
      );


    hash |=
      0;

  }


  return Math.abs(
    hash
  );

}



/* =====================================================
   NEAREST POINT ON ROAD SEGMENT
===================================================== */

function nearestPointOnSegment(

  point,

  a,

  b

) {


  const abX =
    b.x -
    a.x;


  const abY =
    b.y -
    a.y;


  const apX =
    point.x -
    a.x;


  const apY =
    point.y -
    a.y;



  const abLengthSquared =

    abX *
    abX

    +

    abY *
    abY;



  if (
    abLengthSquared ===
    0
  ) {


    return {

      point: {

        x:
          a.x,

        y:
          a.y

      },


      distance:

        Math.hypot(

          point.x -
          a.x,

          point.y -
          a.y

        )

    };

  }



  let t =

    (
      apX *
      abX

      +

      apY *
      abY

    )

    /

    abLengthSquared;



  t =

    Math.max(

      0,

      Math.min(
        1,
        t
      )

    );



  const nearest = {

    x:

      a.x

      +

      abX *
      t,


    y:

      a.y

      +

      abY *
      t

  };



  return {

    point:
      nearest,


    distance:

      Math.hypot(

        point.x -
        nearest.x,

        point.y -
        nearest.y

      )

  };

}



/* =====================================================
   FIND NEAREST ROAD
===================================================== */

function getNearestRoadInfo(
  parking
) {


  const point =

    map.project(

      [

        parking.lng,

        parking.lat

      ]

    );



  /*
    在車格附近找道路
  */

  const searchRadius =
    45;



  const features =

    map.queryRenderedFeatures(

      [

        [

          point.x -
          searchRadius,

          point.y -
          searchRadius

        ],

        [

          point.x +
          searchRadius,

          point.y +
          searchRadius

        ]

      ]

    );



  let best =
    null;



  for (
    const feature
    of
    features
  ) {


    if (
      !feature.geometry
    ) {

      continue;

    }



    /*
      只接受道路相關圖層
    */

    const layerID =

      String(

        feature.layer?.id

        ||

        ""

      )

      .toLowerCase();



    const sourceLayer =

      String(

        feature.layer?.[
          "source-layer"
        ]

        ||

        ""

      )

      .toLowerCase();



    const roadKeyword =

      `${layerID} ${sourceLayer}`;



    if (

      !/road|street|highway|transport|motorway|trunk|primary|secondary|tertiary|residential|service|bridge|tunnel/

        .test(
          roadKeyword
        )

    ) {


      continue;

    }



    let lines =
      [];



    if (
      feature.geometry.type ===
      "LineString"
    ) {


      lines =

        [
          feature.geometry.coordinates
        ];


    }

    else if (
      feature.geometry.type ===
      "MultiLineString"
    ) {


      lines =

        feature.geometry.coordinates;


    }

    else {


      continue;

    }



    for (
      const line
      of
      lines
    ) {


      for (

        let i =
          0;

        i <
        line.length - 1;

        i++

      ) {


        const aLngLat =
          line[i];


        const bLngLat =
          line[i + 1];



        const a =
          map.project(
            aLngLat
          );


        const b =
          map.project(
            bLngLat
          );



        const nearest =

          nearestPointOnSegment(

            point,

            a,

            b

          );



        if (

          !best

          ||

          nearest.distance <
          best.distance

        ) {


          const angle =

            Math.atan2(

              b.y -
              a.y,

              b.x -
              a.x

            )

            *

            180

            /

            Math.PI;



          best = {

            distance:
              nearest.distance,


            nearest:
              nearest.point,


            bearing:
              angle

          };

        }

      }

    }

  }



  return best;

}



/* =====================================================
   MOVE PARKING SPACE TO ROAD SIDE
===================================================== */

function getAlignedParkingDisplay(
  parking
) {


  const roadInfo =

    getNearestRoadInfo(
      parking
    );



  /*
    找不到道路就使用原始座標
  */

  if (
    !roadInfo
  ) {


    return {

      lng:
        parking.lng,

      lat:
        parking.lat,

      rotation:
        0

    };

  }



  /*
    依車格 ID 穩定分配到道路左 / 右側
  */

  const hash =

    hashString(

      parking.cellId

      ||

      parking.id

      ||

      `${parking.lng},${parking.lat}`

    );



  const side =

    hash %
    2 ===
    0

      ? 1

      : -1;



  /*
    從道路中心線往外移
  */

  const offsetPixels =
    13;



  const perpendicularAngle =

    (
      roadInfo.bearing

      +

      (
        side >
        0

          ? 90

          : -90
      )
    )

    *

    Math.PI

    /

    180;



  const targetX =

    roadInfo.nearest.x

    +

    Math.cos(
      perpendicularAngle
    )

    *

    offsetPixels;



  const targetY =

    roadInfo.nearest.y

    +

    Math.sin(
      perpendicularAngle
    )

    *

    offsetPixels;



  const lngLat =

    map.unproject(

      [

        targetX,

        targetY

      ]

    );



  return {

    lng:
      lngLat.lng,

    lat:
      lngLat.lat,

    /*
      長方形方向跟道路一致
    */

    rotation:
      roadInfo.bearing

  };

}

/* =====================================================
   GEOJSON
===================================================== */

function buildFeatureCollection(
  list
) {


  return {

    type:
      "FeatureCollection",


    features:

      list.map(

        parking => {


          const aligned =

            getAlignedParkingDisplay(
              parking
            );



          return {

            type:
              "Feature",


            geometry: {

              type:
                "Point",


              coordinates: [

                aligned.lng,

                aligned.lat

              ]

            },


            properties: {


              id:
                parking.id ||
                "",


              cellId:
                parking.cellId ||
                "",


              roadName:
                parking.roadName ||
                "",


              name:
                parking.name ||
                "",


              pay:
                parking.pay ||
                "",


              payCash:
                parking.payCash ||
                "",


              hour:
                parking.hour ||
                "",


              statusKey:
                parking.statusKey ||
                "unknown",


              displayStatus:
                parking.displayStatus

                ||

                parking.statusLabel

                ||

                "狀態未知",


              markerColor:
                parking.markerColor ||
                "#9ca3af",


              /*
                導航仍使用政府原始座標
              */

              lat:
                parking.lat,


              lng:
                parking.lng,


              rotation:
                aligned.rotation ||
                0

            }

          };

        }

      )

  };

}



/* =====================================================
   FILTER
===================================================== */

function getActiveFilters() {


  const filters =
    new Set();



  if (
    filterEmpty.checked
  ) {


    filters.add(
      "empty"
    );

  }



  if (
    filterOccupied.checked
  ) {


    filters.add(
      "occupied"
    );

  }



  if (
    filterUnknown.checked
  ) {


    filters.add(
      "unknown"
    );

  }


  return filters;

}



/* =====================================================
   FILTER COUNTS
===================================================== */

function updateFilterCounts(
  visible
) {


  const counts = {

    empty:
      0,

    occupied:
      0,

    unknown:
      0

  };



  visible.forEach(

    parking => {


      const key =

        parking.statusKey

        ||

        "unknown";



      if (
        counts[key]
        !==
        undefined
      ) {


        counts[key]++;

      }

    }

  );



  emptyCount.textContent =
    counts.empty;


  occupiedCount.textContent =
    counts.occupied;


  unknownCount.textContent =
    counts.unknown;

}



/* =====================================================
   RENDER
===================================================== */

function renderParking() {


  if (

    !mapReady

    ||

    !map.getSource(
      "parking-source"
    )

  ) {


    return;

  }



  if (
    !parkingData.length
  ) {


    map
      .getSource(
        "parking-source"
      )
      .setData({

        type:
          "FeatureCollection",

        features:
          []

      });



    bottomCount.textContent =

      "目前沒有停車格資料";


    return;

  }



  const zoom =
    map.getZoom();



  if (
    zoom <
    MIN_ZOOM
  ) {


    map
      .getSource(
        "parking-source"
      )
      .setData({

        type:
          "FeatureCollection",

        features:
          []

      });



    bottomCount.textContent =

      "請放大地圖查看停車格";


    return;

  }



  const bounds =
    map.getBounds();



  const visibleAll =

    parkingData.filter(

      parking =>

        bounds.contains(

          [

            parking.lng,

            parking.lat

          ]

        )

    );



  updateFilterCounts(
    visibleAll
  );



  const filters =
    getActiveFilters();



  const filtered =

    visibleAll.filter(

      parking =>

        filters.has(

          parking.statusKey

          ||

          "unknown"

        )

    );



  const list =

    filtered.slice(

      0,

      MAX_VISIBLE_MARKERS

    );



  map
    .getSource(
      "parking-source"
    )
    .setData(

      buildFeatureCollection(
        list
      )

    );



  if (
    visibleAll.length ===
    0
  ) {


    bottomCount.textContent =

      "目前畫面內沒有停車格";

  }


  else if (

    filtered.length ===
    visibleAll.length

  ) {


    bottomCount.textContent =

      `目前畫面內有 ${visibleAll.length.toLocaleString()} 個停車格`;

  }


  else {


    bottomCount.textContent =

      `目前顯示 ${filtered.length.toLocaleString()} / ${visibleAll.length.toLocaleString()} 個停車格`;

  }

}



/* =====================================================
   NAVIGATION
===================================================== */

function openNavigation(

  lat,

  lng

) {


  const url =

    "https://www.google.com/maps/dir/?api=1"

    +

    "&destination="

    +

    encodeURIComponent(

      `${lat},${lng}`

    )

    +

    "&travelmode=driving";



  window.open(

    url,

    "_blank",

    "noopener,noreferrer"

  );

}



/* =====================================================
   POPUP
===================================================== */

function showParkingPopup(
  feature
) {


  const p =

    feature.properties

    ||

    {};



  const lat =
    Number(
      p.lat
    );


  const lng =
    Number(
      p.lng
    );



  const popupHTML = `


    <div class="parking-popup">


      <div class="parking-title">

        路邊停車格

      </div>



      <div class="parking-status-line">


        <span

          class="popup-space"

          style="
            background:
            ${escapeHTML(
              p.markerColor ||
              "#9ca3af"
            )}
          "

        ></span>


        <strong>

          ${escapeHTML(

            p.displayStatus

            ||

            "狀態未知"

          )}

        </strong>


      </div>



      <div class="row">

        車格編號：

        <strong>

          ${escapeHTML(

            p.cellId

            ||

            p.id

            ||

            "未提供"

          )}

        </strong>

      </div>



      <div class="row">

        路段：

        ${escapeHTML(

          p.roadName

          ||

          "未提供"

        )}

      </div>



      <div class="row">

        類型：

        ${escapeHTML(

          p.name

          ||

          "未提供"

        )}

      </div>



      <div class="row">

        收費方式：

        ${escapeHTML(

          p.pay

          ||

          "未提供"

        )}

      </div>



      <div class="row">

        收費：

        ${escapeHTML(

          p.payCash

          ||

          "未提供"

        )}

      </div>



      <div class="row">

        收費時間：

        ${escapeHTML(

          p.hour

          ||

          "未提供"

        )}

      </div>



      <button

        class="navigation-button"

        onclick="openNavigation(${lat}, ${lng})"

      >

        導航至此車格

      </button>


    </div>

  `;



  new maplibregl.Popup({

    /*
      不顯示右上 X
    */

    closeButton:
      false,


    /*
      點其他地圖位置即可關閉
    */

    closeOnClick:
      true,


    offset:
      16

  })

  .setLngLat(

    feature
      .geometry
      .coordinates

  )

  .setHTML(
    popupHTML
  )

  .addTo(
    map
  );

}



/* =====================================================
   USER LOCATION
===================================================== */

function setUserLocation(

  lng,

  lat

) {


  if (
    userMarker
  ) {


    userMarker.remove();

  }



  const element =

    document.createElement(
      "div"
    );



  element.className =
    "user-dot";



  userMarker =

    new maplibregl.Marker({

      element:
        element,

      anchor:
        "center"

    })


    .setLngLat(

      [
        lng,
        lat
      ]

    )


    .setPopup(

      new maplibregl.Popup({

        offset:
          16,

        closeButton:
          false

      })

      .setText(

        "你的目前位置"

      )

    )


    .addTo(
      map
    );

}



/* =====================================================
   INITIAL LOCATION
===================================================== */

function locateUser() {


  if (
    !navigator.geolocation
  ) {


    map.jumpTo({

      center:
        DEFAULT_CENTER,

      zoom:
        16,

      pitch:
        0,

      bearing:
        0

    });


    return;

  }



  navigator
    .geolocation
    .getCurrentPosition(


      position => {


        const lat =
          position.coords.latitude;


        const lng =
          position.coords.longitude;



        setUserLocation(

          lng,

          lat

        );



        map.jumpTo({

          center: [

            lng,

            lat

          ],

          zoom:
            16,

          pitch:
            0,

          bearing:
            0

        });



        renderParking();

      },


      () => {


        map.jumpTo({

          center:
            DEFAULT_CENTER,

          zoom:
            16,

          pitch:
            0,

          bearing:
            0

        });


        renderParking();

      },


      {

        enableHighAccuracy:
          true,

        timeout:
          10000,

        maximumAge:
          0

      }

    );

}



/* =====================================================
   LOCATION BUTTON
===================================================== */

function moveToUserLocation() {


  if (
    !navigator.geolocation
  ) {


    alert(
      "此裝置不支援定位功能"
    );


    return;

  }



  locateButton.disabled =
    true;



  navigator
    .geolocation
    .getCurrentPosition(


      position => {


        const lat =
          position.coords.latitude;


        const lng =
          position.coords.longitude;



        setUserLocation(

          lng,

          lat

        );



        map.easeTo({

          center: [

            lng,

            lat

          ],

          zoom:
            Math.max(
              map.getZoom(),
              16
            ),

          bearing:
            0,

          pitch:
            0,

          duration:
            800

        });



        locateButton.disabled =
          false;

      },


      error => {


        console.error(
          error
        );


        alert(
          "目前無法取得你的位置，請確認瀏覽器定位權限。"
        );


        locateButton.disabled =
          false;

      },


      {

        enableHighAccuracy:
          true,

        timeout:
          10000,

        maximumAge:
          0

      }

    );

}



/* =====================================================
   FILTER EVENTS
===================================================== */

[
  filterEmpty,

  filterOccupied,

  filterUnknown

]

.forEach(

  checkbox => {


    checkbox.addEventListener(

      "change",

      renderParking

    );

  }

);



selectAllButton.addEventListener(

  "click",

  () => {


    filterEmpty.checked =
      true;


    filterOccupied.checked =
      true;


    filterUnknown.checked =
      true;


    renderParking();

  }

);



clearAllButton.addEventListener(

  "click",

  () => {


    filterEmpty.checked =
      false;


    filterOccupied.checked =
      false;


    filterUnknown.checked =
      false;


    renderParking();

  }

);



/* =====================================================
   LIVE REFRESH BUTTON
===================================================== */

reloadButton.addEventListener(

  "click",

  refreshLiveParking

);



/* =====================================================
   LOCATE BUTTON EVENT
===================================================== */

locateButton.addEventListener(

  "click",

  moveToUserLocation

);



/* =====================================================
   MAP LOAD
===================================================== */

map.on(

  "load",

  async () => {


    simplifyMapStyle();


    ensureParkingSourceAndLayer();


    mapReady =
      true;



    /*
      點擊車格
    */

    map.on(

      "click",

      "parking-layer",

      event => {


        const feature =

          event.features

          &&

          event.features[0];



        if (
          feature
        ) {


          showParkingPopup(
            feature
          );

        }

      }

    );



    /*
      電腦滑鼠提示
    */

    map.on(

      "mouseenter",

      "parking-layer",

      () => {


        map
          .getCanvas()
          .style
          .cursor =
            "pointer";

      }

    );



    map.on(

      "mouseleave",

      "parking-layer",

      () => {


        map
          .getCanvas()
          .style
          .cursor =
            "";

      }

    );



    /*
      初次定位
    */

    locateUser();



    /*
      初次開啟先使用 GitHub parking.json
    */

    try {


      await loadStaticParking();


    }

    catch (
      error
    ) {


      console.error(
        error
      );


      /*
        GitHub 備援失敗時，
        改打 Vercel Live API
      */

      await refreshLiveParking();

    }

  }

);



/* =====================================================
   MAP MOVE
===================================================== */

map.on(

  "moveend",

  renderParking

);



map.on(

  "zoomend",

  renderParking

);



/* =====================================================
   MAP ERROR
===================================================== */

map.on(

  "error",

  event => {


    console.warn(

      "地圖載入錯誤：",

      event

    );

  }

);


</script>
