<script>


/* =========================================================
   VERSION
========================================================= */

const APP_VERSION =
  "1.0.4";



/* =========================================================
   LIVE API

   Cloudflare Worker 建立後
   將這裡換成：

   https://xxxx.workers.dev/parking
========================================================= */

const LIVE_API_URL =
  "https://smart-parking-app-api.vercel.app/api/parking";



/* =========================================================
   CONFIG
========================================================= */

const DEFAULT_CENTER = [

  121.4618,

  25.0114

];


const MIN_ZOOM =
  15;


const MAX_VISIBLE_MARKERS =
  1500;


const MAP_STYLE_URL =

  "https://tiles.openfreemap.org/styles/liberty";



/* =========================================================
   DOM
========================================================= */

const menuButton =
  document.getElementById(
    "menuButton"
  );


const menuClose =
  document.getElementById(
    "menuClose"
  );


const menuBackdrop =
  document.getElementById(
    "menuBackdrop"
  );


const sideMenu =
  document.getElementById(
    "sideMenu"
  );


const reloadButton =
  document.getElementById(
    "reloadButton"
  );


const bottomCount =
  document.getElementById(
    "bottomCount"
  );


const bottomStatus =
  document.getElementById(
    "bottomStatus"
  );


const filterEmpty =
  document.getElementById(
    "filterEmpty"
  );


const filterOccupied =
  document.getElementById(
    "filterOccupied"
  );


const filterUnknown =
  document.getElementById(
    "filterUnknown"
  );


const emptyCount =
  document.getElementById(
    "emptyCount"
  );


const occupiedCount =
  document.getElementById(
    "occupiedCount"
  );


const unknownCount =
  document.getElementById(
    "unknownCount"
  );


const selectAllButton =
  document.getElementById(
    "selectAllButton"
  );


const clearAllButton =
  document.getElementById(
    "clearAllButton"
  );



/* =========================================================
   STATE
========================================================= */

let parkingData =
  [];


let userMarker =
  null;


let mapReady =
  false;


let styleSimplified =
  false;



/* =========================================================
   MAP
========================================================= */

const map =

  new maplibregl.Map({

    container:
      "map",

    style:
      MAP_STYLE_URL,

    center:
      DEFAULT_CENTER,

    zoom:
      16,

    pitch:
      0,

    bearing:
      0,

    minZoom:
      11,

    maxZoom:
      19,

    attributionControl:
      false,

    dragRotate:
      false,

    pitchWithRotate:
      false,

    touchPitch:
      false

  });



map.addControl(

  new maplibregl.AttributionControl({

    compact:
      true

  }),

  "bottom-right"

);



/* =========================================================
   MENU
========================================================= */

function openMenu() {

  sideMenu
    .classList
    .add(
      "open"
    );


  menuBackdrop
    .classList
    .add(
      "open"
    );

}


function closeMenu() {

  sideMenu
    .classList
    .remove(
      "open"
    );


  menuBackdrop
    .classList
    .remove(
      "open"
    );

}


menuButton.addEventListener(

  "click",

  openMenu

);


menuClose.addEventListener(

  "click",

  closeMenu

);


menuBackdrop.addEventListener(

  "click",

  closeMenu

);



/* =========================================================
   COMMON
========================================================= */

function getValue(

  object,

  ...keys

) {


  for (
    const key
    of
    keys
  ) {


    const value =
      object[
        key
      ];


    if (

      value !==
      undefined

      &&

      value !==
      null

      &&

      value !==
      ""

    ) {


      return value;

    }

  }


  return "";

}



function escapeHTML(
  value
) {


  return String(
    value ?? ""
  )

  .replaceAll(
    "&",
    "&amp;"
  )

  .replaceAll(
    "<",
    "&lt;"
  )

  .replaceAll(
    ">",
    "&gt;"
  )

  .replaceAll(
    '"',
    "&quot;"
  )

  .replaceAll(
    "'",
    "&#039;"
  );

}



/* =========================================================
   MAP STYLE
========================================================= */

function simplifyMapStyle() {


  if (
    styleSimplified
  ) {

    return;

  }


  const style =
    map.getStyle();


  if (
    !style ||
    !style.layers
  ) {

    return;

  }



  for (
    const layer
    of
    style.layers
  ) {


    const id =

      String(
        layer.id ||
        ""
      )

      .toLowerCase();



    const sourceLayer =

      String(

        layer[
          "source-layer"
        ]

        ||

        ""

      )

      .toLowerCase();



    const type =

      String(

        layer.type

        ||

        ""

      )

      .toLowerCase();



    const keyword =

      `${id} ${sourceLayer}`;



    if (
      type ===
      "fill-extrusion"
    ) {


      map.setLayoutProperty(

        layer.id,

        "visibility",

        "none"

      );


      continue;

    }



    const isBackground =

      type ===
      "background";



    const isWater =

      /water|ocean|river|lake|stream|canal/
      .test(
        keyword
      );



    const isLand =

      /landuse|landcover|park|grass|wood|forest|residential/
      .test(
        keyword
      )

      &&

      type !==
      "symbol";



    const isBuilding =

      /building/
      .test(
        keyword
      )

      &&

      type ===
      "fill";



    const isRoadGeometry =

      /road|street|highway|transport|bridge|tunnel|motorway|trunk|primary|secondary|tertiary|path/
      .test(
        keyword
      )

      &&

      (
        type ===
        "line"

        ||

        type ===
        "fill"
      );



    const isRoadLabel =

      /road|street|highway|transport|bridge|tunnel|motorway|trunk|primary|secondary|tertiary/
      .test(
        keyword
      )

      &&

      type ===
      "symbol";



    const isShopLabel =

      /poi|shop|store|amenity|commercial|retail|restaurant|cafe|food|bank|hospital|pharmacy|hotel/
      .test(
        keyword
      )

      &&

      type ===
      "symbol";



    const keep =

      isBackground ||

      isWater ||

      isLand ||

      isBuilding ||

      isRoadGeometry ||

      isRoadLabel ||

      isShopLabel;



    map.setLayoutProperty(

      layer.id,

      "visibility",

      keep
        ? "visible"
        : "none"

    );

  }


  styleSimplified =
    true;

}



/* =========================================================
   STATUS
========================================================= */

function analyzeSingleStatus(
  value
) {


  if (
    value ===
    undefined
    ||
    value ===
    null
  ) {

    return null;

  }


  const normalized =

    String(
      value
    )

    .trim()

    .toLowerCase();



  if (
    !normalized
  ) {

    return null;

  }



  if (

    [
      "0",
      "n",
      "no",
      "false"
    ]

    .includes(
      normalized
    )

  ) {


    return {

      key:
        "empty",

      label:
        "空白停車格",

      color:
        "#22c55e"

    };

  }



  if (

    [
      "1",
      "y",
      "yes",
      "true"
    ]

    .includes(
      normalized
    )

  ) {


    return {

      key:
        "occupied",

      label:
        "已有停車",

      color:
        "#ef4444"

    };

  }



  const emptyKeywords = [

    "空位",
    "空車位",
    "無車",
    "可停",
    "空車",

    "available",
    "empty",
    "vacant",
    "free"

  ];



  const occupiedKeywords = [

    "有車",
    "已停",
    "占用",
    "佔用",

    "occupied",
    "full",
    "busy"

  ];



  if (

    emptyKeywords.some(

      keyword =>

        normalized.includes(
          keyword
        )

    )

  ) {


    return {

      key:
        "empty",

      label:
        "空白停車格",

      color:
        "#22c55e"

    };

  }



  if (

    occupiedKeywords.some(

      keyword =>

        normalized.includes(
          keyword
        )

    )

  ) {


    return {

      key:
        "occupied",

      label:
        "已有停車",

      color:
        "#ef4444"

    };

  }


  return null;

}



function getAvailability(
  parking
) {


  const candidates = [

    parking.parkingStatus,

    parking.cellStatus

  ];



  for (
    const candidate
    of
    candidates
  ) {


    const result =

      analyzeSingleStatus(
        candidate
      );


    if (
      result
    ) {


      return result;

    }

  }



  return {

    key:
      "unknown",

    label:
      "狀態未知",

    color:
      "#9ca3af"

  };

}



/* =========================================================
   NORMALIZE
========================================================= */

function normalizeParking(
  raw
) {


  const lat =
    Number(

      getValue(

        raw,

        "latitude",
        "Latitude",
        "LATITUDE",

        "lat",
        "LAT",

        "定位坐標[緯度]",
        "定位坐標 [緯度]",
        "緯度"

      )

    );



  const lng =
    Number(

      getValue(

        raw,

        "longitude",
        "Longitude",
        "LONGITUDE",

        "lng",
        "lon",

        "LNG",
        "LON",

        "定位坐標[經度]",
        "定位坐標 [經度]",
        "經度"

      )

    );



  if (

    !Number.isFinite(
      lat
    )

    ||

    !Number.isFinite(
      lng
    )

    ||

    lat === 0

    ||

    lng === 0

    ||

    lat < 24

    ||

    lat > 26

    ||

    lng < 120

    ||

    lng > 123

  ) {


    return null;

  }



  const parking = {


    id:

      String(

        getValue(

          raw,

          "id",
          "ID",
          "系統編號"

        )

      ),


    cellId:

      String(

        getValue(

          raw,

          "cellid",
          "CELLID",
          "CellID",
          "車格編號"

        )

      ),


    name:

      String(

        getValue(

          raw,

          "name",
          "NAME",
          "類型"

        )

      ),


    roadName:

      String(

        getValue(

          raw,

          "roadname",
          "ROADNAME",
          "RoadName",
          "路段名稱"

        )

      ),


    hour:

      String(

        getValue(

          raw,

          "hour",
          "HOUR",
          "開放停車時間說明"

        )

      ),


    pay:

      String(

        getValue(

          raw,

          "pay",
          "PAY",
          "收費方式"

        )

      ),


    payCash:

      String(

        getValue(

          raw,

          "paycash",
          "PAYCASH",
          "收費計價"

        )

      ),


    cellStatus:

      String(

        getValue(

          raw,

          "cellstatus",
          "CELLSTATUS",
          "CellStatus",
          "車格狀態"

        )

      ),


    parkingStatus:

      String(

        getValue(

          raw,

          "parkingstatus",
          "PARKINGSTATUS",
          "ParkingStatus",
          "停車狀態"

        )

      ),


    lat,

    lng

  };



  const availability =

    getAvailability(
      parking
    );



  parking.markerColor =

    availability.color;



  parking.statusKey =

    availability.key;



  parking.displayStatus =

    availability.label;



  return parking;

}



/* =========================================================
   PARSE LIVE CSV
========================================================= */

function parseLiveCSV(
  csvText
) {


  const result =

    Papa.parse(

      csvText,

      {

        header:
          true,

        skipEmptyLines:
          true

      }

    );



  return result.data

    .map(
      normalizeParking
    )

    .filter(
      Boolean
    );

}



/* =========================================================
   LOAD STATIC
========================================================= */

async function loadStaticParking() {


  const response =

    await fetch(

      `./parking.json?t=${Date.now()}`,

      {

        cache:
          "no-store"

      }

    );



  if (
    !response.ok
  ) {


    throw new Error(

      `parking.json HTTP ${response.status}`

    );

  }



  const result =

    await response.json();



  parkingData =

    Array.isArray(
      result.data
    )

      ? result.data

      : [];



  bottomStatus.textContent =

    `已載入 ${parkingData.length.toLocaleString()} 個停車格 · GitHub 備援資料`;



  renderParking();

}



/* =========================================================
   LIVE REFRESH

   使用者按重新整理時
   直接重新打政府 API
========================================================= */

async function refreshLiveParking() {


  reloadButton.disabled =
    true;


  reloadButton.textContent =
    "更新中…";


  bottomStatus.textContent =
    "正在向政府 API 取得最新資料…";


  try {


    const response =

      await fetch(

        LIVE_API_URL +

        "?t=" +

        Date.now(),

        {

          method:
            "GET",

          cache:
            "no-store"

        }

      );



    if (
      !response.ok
    ) {


      throw new Error(

        `Live API HTTP ${response.status}`

      );

    }



    const csvText =

      await response.text();



    const latestData =

      parseLiveCSV(
        csvText
      );



    if (
      !latestData.length
    ) {


      throw new Error(

        "即時 API 沒有可用停車資料"

      );

    }



    parkingData =
      latestData;



    const now =

      new Date();



    bottomStatus.textContent =

      `即時更新完成 · ${now.toLocaleTimeString("zh-TW")}`;



    renderParking();


  }

  catch (
    error
  ) {


    console.error(
      error
    );


    bottomStatus.textContent =

      "即時更新失敗，保留目前資料";

  }

  finally {


    reloadButton.disabled =
      false;


    reloadButton.textContent =
      "重新整理";

  }

}



/* =========================================================
   RECTANGLE ICON
========================================================= */

function createParkingIcon(

  name,

  color

) {


  const width =
    28;


  const height =
    14;



  const canvas =

    document.createElement(
      "canvas"
    );



  canvas.width =
    width;


  canvas.height =
    height;



  const ctx =

    canvas.getContext(
      "2d"
    );



  /*
    外框
  */

  ctx.fillStyle =
    "#ffffff";


  ctx.fillRect(

    0,

    0,

    width,

    height

  );



  /*
    車位本體
  */

  ctx.fillStyle =
    color;


  ctx.fillRect(

    2,

    2,

    width - 4,

    height - 4

  );



  const imageData =

    ctx.getImageData(

      0,

      0,

      width,

      height

    );



  if (
    !map.hasImage(
      name
    )
  ) {


    map.addImage(

      name,

      imageData,

      {

        pixelRatio:
          2

      }

    );

  }

}



/* =========================================================
   SOURCE
========================================================= */

function ensureParkingSourceAndLayer() {


  createParkingIcon(

    "parking-empty",

    "#22c55e"

  );


  createParkingIcon(

    "parking-occupied",

    "#ef4444"

  );


  createParkingIcon(

    "parking-unknown",

    "#9ca3af"

  );



  if (
    !map.getSource(
      "parking-source"
    )
  ) {


    map.addSource(

      "parking-source",

      {

        type:
          "geojson",


        data: {

          type:
            "FeatureCollection",

          features:
            []

        }

      }

    );

  }



  if (
    !map.getLayer(
      "parking-layer"
    )
  ) {


    map.addLayer({

      id:
        "parking-layer",


      type:
        "symbol",


      source:
        "parking-source",


      layout: {


        "icon-image":

          [
            "match",

            [
              "get",
              "statusKey"
            ],

            "empty",
            "parking-empty",

            "occupied",
            "parking-occupied",

            "parking-unknown"
          ],


        "icon-size":

          [
            "interpolate",

            [
              "linear"
            ],

            [
              "zoom"
            ],

            14,
            0.8,

            16,
            1,

            18,
            1.3

          ],


        "icon-allow-overlap":
          true,


        "icon-ignore-placement":
          true

      }

    });

  }

}



/* =========================================================
   GEOJSON
========================================================= */

function buildFeatureCollection(
  list
) {


  return {

    type:
      "FeatureCollection",


    features:

      list.map(

        parking => ({

          type:
            "Feature",


          geometry: {

            type:
              "Point",

            coordinates: [

              parking.lng,

              parking.lat

            ]

          },


          properties: {


            id:
              parking.id ||
              "",


            cellId:
              parking.cellId ||
              "",


            roadName:
              parking.roadName ||
              "",


            name:
              parking.name ||
              "",


            pay:
              parking.pay ||
              "",


            payCash:
              parking.payCash ||
              "",


            hour:
              parking.hour ||
              "",


            statusKey:
              parking.statusKey ||
              "unknown",


            displayStatus:
              parking.displayStatus ||
              "狀態未知",


            markerColor:
              parking.markerColor ||
              "#9ca3af",


            lat:
              parking.lat,


            lng:
              parking.lng

          }

        })

      )

  };

}



/* =========================================================
   FILTER
========================================================= */

function getActiveFilters() {


  const filters =
    new Set();



  if (
    filterEmpty.checked
  ) {


    filters.add(
      "empty"
    );

  }



  if (
    filterOccupied.checked
  ) {


    filters.add(
      "occupied"
    );

  }



  if (
    filterUnknown.checked
  ) {


    filters.add(
      "unknown"
    );

  }


  return filters;

}



/* =========================================================
   COUNTS
========================================================= */

function updateFilterCounts(
  visible
) {


  const counts = {

    empty:
      0,

    occupied:
      0,

    unknown:
      0

  };



  visible.forEach(

    parking => {


      const key =

        parking.statusKey

        ||

        "unknown";



      if (
        counts[key]
        !==
        undefined
      ) {


        counts[key]++;

      }

    }

  );



  emptyCount.textContent =

    counts.empty;



  occupiedCount.textContent =

    counts.occupied;



  unknownCount.textContent =

    counts.unknown;

}



/* =========================================================
   RENDER
========================================================= */

function renderParking() {


  if (

    !mapReady

    ||

    !map.getSource(
      "parking-source"
    )

  ) {


    return;

  }



  if (
    !parkingData.length
  ) {


    bottomCount.textContent =

      "目前沒有停車格資料";


    return;

  }



  const zoom =

    map.getZoom();



  if (
    zoom <
    MIN_ZOOM
  ) {


    map
      .getSource(
        "parking-source"
      )
      .setData({

        type:
          "FeatureCollection",

        features:
          []

      });



    bottomCount.textContent =

      "請放大地圖查看停車格";


    return;

  }



  const bounds =

    map.getBounds();



  const visibleAll =

    parkingData.filter(

      parking =>

        bounds.contains(

          [

            parking.lng,

            parking.lat

          ]

        )

    );



  updateFilterCounts(
    visibleAll
  );



  const filters =

    getActiveFilters();



  const filtered =

    visibleAll.filter(

      parking =>

        filters.has(

          parking.statusKey

          ||

          "unknown"

        )

    );



  const list =

    filtered.slice(

      0,

      MAX_VISIBLE_MARKERS

    );



  map
    .getSource(
      "parking-source"
    )
    .setData(

      buildFeatureCollection(
        list
      )

    );



  if (
    visibleAll.length ===
    0
  ) {


    bottomCount.textContent =

      "目前畫面內沒有停車格";


  }

  else if (

    filtered.length ===
    visibleAll.length

  ) {


    bottomCount.textContent =

      `目前畫面內有 ${visibleAll.length.toLocaleString()} 個停車格`;


  }

  else {


    bottomCount.textContent =

      `目前顯示 ${filtered.length.toLocaleString()} / ${visibleAll.length.toLocaleString()} 個停車格`;

  }

}



/* =========================================================
   NAVIGATION
========================================================= */

function openNavigation(

  lat,

  lng

) {


  const url =

    "https://www.google.com/maps/dir/?api=1" +

    "&destination=" +

    encodeURIComponent(

      `${lat},${lng}`

    ) +

    "&travelmode=driving";



  window.open(

    url,

    "_blank",

    "noopener,noreferrer"

  );

}



/* =========================================================
   POPUP
========================================================= */

function showParkingPopup(

) {


  const p =

    feature.properties

    ||

    {};



  const lat =

    Number(
      p.lat
    );


  const lng =

    Number(
      p.lng
    );



  const popupHTML = `


  <div class="parking-popup">


    <div class="parking-title">

      路邊停車格

    </div>



    <div class="parking-status-line">


      <span

        class="popup-space"

        style="
          background:
          ${escapeHTML(
            p.markerColor ||
            "#9ca3af"
          )}
        "

      ></span>


      <strong>

        ${escapeHTML(

          p.displayStatus

          ||

          "狀態未知"

        )}

      </strong>


    </div>



    <div class="row">

      車格編號：

      <strong>

        ${escapeHTML(

          p.cellId

          ||

          p.id

          ||

          "未提供"

        )}

      </strong>

    </div>



    <div class="row">

      路段：

      ${escapeHTML(

        p.roadName

        ||

        "未提供"

      )}

    </div>



    <div class="row">

      類型：

      ${escapeHTML(

        p.name

        ||

        "未提供"

      )}

    </div>



    <div class="row">

      收費方式：

      ${escapeHTML(

        p.pay

        ||

        "未提供"

      )}

    </div>



    <div class="row">

      收費：

      ${escapeHTML(

        p.payCash

        ||

        "未提供"

      )}

    </div>



    <div class="row">

      收費時間：

      ${escapeHTML(

        p.hour

        ||

        "未提供"

      )}

    </div>



    <button

      class="navigation-button"

      onclick="openNavigation(${lat}, ${lng})"

    >

      導航至此停車格

    </button>


  </div>

  `;



  new maplibregl.Popup({

    /*
      不顯示右上 X
    */

      false,


    /*
      點擊地圖其他地方
      Popup 自動關閉
    */

    closeOnClick:
      true,


    offset:
      16

  })

  .setLngLat(

    feature
      .geometry
      .coordinates

  )

  .setHTML(
    popupHTML
  )

  .addTo(
    map
  );

/* =========================================================
   GPS
========================================================= */

function setUserLocation(

  lng,

  lat

) {


  if (
    userMarker
  ) {


    userMarker.remove();

  }



  const element =

    document.createElement(
      "div"
    );



  element.className =

    "user-dot";



  userMarker =

    new maplibregl.Marker({

      element:

        element,


      anchor:

        "center"

    })


    .setLngLat(

      [
        lng,
        lat
      ]

    )


    .setPopup(

      new maplibregl.Popup({

        offset:
          16,

        closeButton:
          false

      })

      .setText(

        "你的目前位置"

      )

    )


    .addTo(
      map
    );

}



function locateUser() {


  if (
    !navigator.geolocation
  ) {


    return;

  }



  navigator.geolocation

    .getCurrentPosition(


      position => {


        const lat =

          position
            .coords
            .latitude;



        const lng =

          position
            .coords
            .longitude;



        setUserLocation(

          lng,

          lat

        );



        map.jumpTo({

          center: [

            lng,

            lat

          ],

          zoom:
            16,

          pitch:
            0,

          bearing:
            0

        });



        renderParking();

      },


      () => {


        map.jumpTo({

          center:

            DEFAULT_CENTER,

          zoom:
            16,

          pitch:
            0,

          bearing:
            0

        });

      },


      {

        enableHighAccuracy:
          true,

        timeout:
          10000,

        maximumAge:
          0

      }

    );

}



/* =========================================================
   EVENTS
========================================================= */

[
  filterEmpty,
  filterOccupied,
  filterUnknown
]

.forEach(

  checkbox => {


    checkbox.addEventListener(

      "change",

      renderParking

    );

  }

);



selectAllButton.addEventListener(

  "click",

  () => {


    filterEmpty.checked =
      true;


    filterOccupied.checked =
      true;


    filterUnknown.checked =
      true;


    renderParking();

  }

);



clearAllButton.addEventListener(

  "click",

  () => {


    filterEmpty.checked =
      false;


    filterOccupied.checked =
      false;


    filterUnknown.checked =
      false;


    renderParking();

  }

);



/*
  重新整理 =
  真的重新打 Live API
*/

reloadButton.addEventListener(

  "click",

  refreshLiveParking

);



/* =========================================================
   MAP LOAD
========================================================= */

map.on(

  "load",

  async () => {


    simplifyMapStyle();


    ensureParkingSourceAndLayer();


    mapReady =
      true;



    map.on(

      "click",

      "parking-layer",

      event => {


        const feature =

          event.features

          &&

          event.features[0];


        if (
          feature
        ) {


          showParkingPopup(
            feature
          );

        }

      }

    );



    map.on(

      "mouseenter",

      "parking-layer",

      () => {


        map
          .getCanvas()
          .style
          .cursor =
            "pointer";

      }

    );



    map.on(

      "mouseleave",

      "parking-layer",

      () => {


        map
          .getCanvas()
          .style
          .cursor =
            "";

      }

    );



    locateUser();



    /*
      第一次進網站：
      先讀 GitHub parking.json

      使用者按重新整理：
      才即時打政府 API
    */

    try {


      await loadStaticParking();


    }

    catch (
      error
    ) {


      console.error(
        error
      );


      /*
        靜態資料失敗時
        再嘗試 Live API
      */

      await refreshLiveParking();

    }

  }

);



map.on(

  "moveend",

  renderParking

);



map.on(

  "zoomend",

  renderParking

);


</script>
